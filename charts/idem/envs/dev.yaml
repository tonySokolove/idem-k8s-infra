# Среда dev: только то, что отличается от services/*.yaml.
# Теги образов сервисов — не здесь, а в argocd/idem-dev.yaml (helm.parameters), чтобы их можно было
# менять в Argo CD: Application idem-dev → Details → Manifest.

# Секреты из OpenBao (https://idem-secret-manager.thelid.ru), KV mount idem/.
# Kubernetes Secret с именем ключа создаётся и обновляется External Secrets Operator.
externalSecrets:
  enabled: true
  refreshInterval: 1h
  store:
    name: openbao
    server: http://openbao.openbao.svc:8200
    path: idem
    role: external-secrets
  secrets:
    idem-postgresql:
      path: dev/postgresql
    idem-registrar-simulator:
      path: dev/registrar-simulator
    idem-check-in:
      path: dev/check-in
    idem-registration:
      path: dev/registration
    ghcr-secret:
      path: dev/ghcr
      template:
        type: kubernetes.io/dockerconfigjson
        data:
          .dockerconfigjson: "{{ .dockerconfigjson }}"

postgresql:
  externalAccess:
    enabled: true
    host: idem-postgres.thelid.ru
    additionalEntryPoints:
      - websecure
    allowedIPs: []

services:
  registrar:
    ingress:
      host: idem-registrar-simulator.thelid.ru

  check-in:
    ingress:
      host: idem-check-in.thelid.ru
    # Добавляются после services/check-in.yaml → env
    extraEnv:
      # ВРЕМЕННО: одно тестовое мероприятие для всех стоек, пока нет Device Service
      - name: CHECKIN_EVENT_ID
        value: e23bbab1-f226-46ca-b558-d253f24418bc
      - name: CARD_BASE_URL
        value: https://idem-check-in.thelid.ru/c/
