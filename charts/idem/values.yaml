# Общие значения для всех сред и сервисов.
# Порядок загрузки (argocd/idem-dev.yaml → valueFiles): values.yaml → services/*.yaml → envs/<env>.yaml,
# поверх всего — helm.parameters Application (теги образов).

imagePullSecrets:
  - name: ghcr-secret

# Ресурсы по умолчанию для сервиса без своего блока resources
global:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

# Квота namespace. Считается как «все сервисы работают» + «все Deployment одновременно в rollout»
# (maxSurge: 1 — на время обновления поднимается второй pod с теми же resources).
# StatefulSet PostgreSQL второй pod не поднимает.
# Сейчас (check-in, registration, registrar, PostgreSQL):
#   limits.cpu      3.3 работают + 2.3 rollout = 5.6  → 6
#   limits.memory   3Gi        + 2Gi         = 5Gi  → 6Gi
#   requests.cpu    0.55       + 0.3         = 0.85 → 1.5
#   requests.memory 1152Mi     + 640Mi       ≈ 1.8Gi → 3Gi
# Новый сервис → пересчитать: его limits × 2.
resourceQuota:
  enabled: true
  hard:
    requestsCpu: "1.5"
    requestsMemory: 3Gi
    limitsCpu: "6"
    limitsMemory: 6Gi

limitRange:
  enabled: true
  defaultRequest:
    cpu: 100m
    memory: 128Mi
  default:
    cpu: 300m
    memory: 512Mi
  max:
    cpu: "2"
    memory: 2Gi

# Заполняются файлами services/*.yaml
postgresql: {}
services: {}
