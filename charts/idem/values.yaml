# Общие значения для всех сред и сервисов.
# Порядок загрузки (argocd/idem-dev.yaml → valueFiles): values.yaml → services/*.yaml → envs/<env>.yaml,
# поверх всего — helm.parameters Application (теги образов).

imagePullSecrets:
  - name: ghcr-secret

# Ресурсы по умолчанию для сервиса без своего блока resources
global:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

resourceQuota:
  enabled: true
  hard:
    requestsCpu: "1.5"
    requestsMemory: 3Gi
    limitsCpu: "4"
    limitsMemory: 6Gi

limitRange:
  enabled: true
  defaultRequest:
    cpu: 100m
    memory: 128Mi
  default:
    cpu: 300m
    memory: 512Mi
  max:
    cpu: "2"
    memory: 2Gi

# Заполняются файлами services/*.yaml
postgresql: {}
services: {}
