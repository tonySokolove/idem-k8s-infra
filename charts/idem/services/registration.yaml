# Registration Service: регистрации и билеты. Только внутри кластера: в templates/registration/ нет ingress.yaml.
# Тег образа — в argocd/idem-dev.yaml (helm.parameters).
services:
  registration:
    enabled: true
    image:
      repository: ghcr.io/tonysokolove/idem-registration
    port: 8080
    servicePort: 80
    healthPath: /health
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 768Mi
    env:
      - name: DB_URL
        value: jdbc:postgresql://idem-postgresql:5432/idem?sslmode=disable
      - name: DB_USERNAME
        value: idem_registration
      - name: DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: idem-registration
            key: db-password
      - name: CHECKIN_TOKEN
        valueFrom:
          secretKeyRef:
            name: idem-registration
            key: checkin-token
      - name: IMPORT_TOKEN
        valueFrom:
          secretKeyRef:
            name: idem-registration
            key: dev-import-token
      # Токены сервисов, которым разрешён внутренний API (ссылаются на переменные выше — порядок важен)
      - name: INTERNAL_API_TOKENS
        value: $(CHECKIN_TOKEN),$(IMPORT_TOKEN)
