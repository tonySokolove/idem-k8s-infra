# PostgreSQL: один экземпляр StatefulSet на среду. Шаблоны — templates/postgresql/.
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "18.6-bookworm"
  auth:
    database: idem
    username: idem
    existingSecret: idem-postgresql
    passwordKey: password
  persistence:
    storageClass: nvme.network-drives.csi.timeweb.cloud
    size: 10Gi
  # Внешний вход через Traefik (TLS); включается и настраивается в envs/<env>.yaml
  externalAccess:
    enabled: false
    host: ""
    entryPoint: postgresql
    additionalEntryPoints: []
    clusterIssuer: letsencrypt-prod
    allowedIPs: []
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
