{{- /*
Секреты сервисов берутся из OpenBao через External Secrets Operator.
Значения хранятся в OpenBao (KV v2, mount externalSecrets.store.path), в Git — только ссылки.
*/ -}}
{{- if and .Values.externalSecrets .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
---
# Общее подключение к OpenBao для всего кластера. ESO входит по своему service account (Kubernetes auth).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore

metadata:
  name: {{ $es.store.name }}
  labels:
    app.kubernetes.io/part-of: idem
    app.kubernetes.io/managed-by: {{ .Release.Service }}

spec:
  provider:
    vault:
      server: {{ $es.store.server | quote }}
      path: {{ $es.store.path | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: {{ $es.store.role | quote }}
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
{{- range $name, $secret := $es.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: idem
    app.kubernetes.io/managed-by: {{ $.Release.Service }}

spec:
  refreshInterval: {{ default $es.refreshInterval $secret.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $es.store.name }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    {{- with $secret.template }}
    template:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  dataFrom:
    - extract:
        key: {{ required (printf "externalSecrets.secrets.%s.path is required" $name) $secret.path | quote }}
{{- end }}
{{- end }}
