{{- range $name, $service := .Values.services }}
{{- if $service.enabled }}
{{- $ctx := dict "name" $name "service" $service "root" $ }}
---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "idem.fullname" $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "idem.labels" $ctx | nindent 4 }}

spec:
  replicas: {{ default 1 $service.replicas }}
  revisionHistoryLimit: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      {{- include "idem.selectorLabels" $ctx | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "idem.labels" $ctx | nindent 8 }}

    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: {{ include "idem.fullname" $name }}

          image: {{ include "idem.image" $ctx | quote }}

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: {{ default 8080 $service.port }}

          resources:
            {{- if $service.resources }}
            {{- toYaml $service.resources | nindent 12 }}
            {{- else }}
            {{- toYaml $.Values.global.resources | nindent 12 }}
            {{- end }}

          readinessProbe:
            httpGet:
              path: {{ default "/health" $service.healthPath }}
              port: http

            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: {{ default "/health" $service.healthPath }}
              port: http

            initialDelaySeconds: 5
            periodSeconds: 10
{{- end }}
{{- end }}
