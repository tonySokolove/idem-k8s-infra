{{- if and .Values.postgresql.enabled .Values.postgresql.externalAccess.enabled }}
{{- $access := .Values.postgresql.externalAccess }}
{{- $host := required "postgresql.externalAccess.host is required" $access.host }}
{{- $allowedIPs := $access.allowedIPs | default list }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: idem-postgresql-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: idem-postgresql-tls
  dnsNames:
    - {{ $host | quote }}
  issuerRef:
    name: {{ $access.clusterIssuer | quote }}
    kind: ClusterIssuer
{{- if $allowedIPs }}
---
apiVersion: traefik.io/v1alpha1
kind: MiddlewareTCP
metadata:
  name: idem-postgresql-allowlist
  namespace: {{ .Release.Namespace }}
spec:
  ipAllowList:
    sourceRange:
      {{- toYaml $allowedIPs | nindent 6 }}
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: idem-postgresql
  namespace: {{ .Release.Namespace }}
spec:
  alpnProtocols:
    - postgresql
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: idem-postgresql
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - {{ $access.entryPoint | quote }}
    {{- range $access.additionalEntryPoints }}
    - {{ . | quote }}
    {{- end }}
  routes:
    - match: {{ printf "HostSNI(`%s`)" $host | quote }}
      {{- if $allowedIPs }}
      middlewares:
        - name: idem-postgresql-allowlist
      {{- end }}
      services:
        - name: idem-postgresql
          port: 5432
  tls:
    secretName: idem-postgresql-tls
    options:
      name: idem-postgresql
{{- end }}
