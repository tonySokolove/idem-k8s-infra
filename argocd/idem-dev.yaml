apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: idem-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/tonySokolove/idem-k8s-infra
    targetRevision: main
    path: charts/idem

    helm:
      # Порядок важен: следующий файл перекрывает предыдущий. Новый сервис — добавить его services/<name>.yaml.
      valueFiles:
        - services/postgresql.yaml
        - services/registrar.yaml
        - services/check-in.yaml
        - services/registration.yaml
        - envs/dev.yaml
      # Версии образов сервисов. Видны и редактируются в Argo CD: idem-dev → Details → Manifest.
      # Правка в UI меняет только Application в кластере — перенесите её сюда, иначе
      # следующий kubectl apply этого файла вернёт старую версию.
      parameters:
        - name: services.registrar.image.tag
          value: "0.1.2"
          forceString: true
        - name: services.check-in.image.tag
          value: "0.1.0"
          forceString: true
        - name: services.registration.image.tag
          value: "0.1.0"
          forceString: true

  destination:
    server: https://kubernetes.default.svc
    namespace: idem
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
