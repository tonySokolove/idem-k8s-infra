# External Secrets Operator: копирует секреты из OpenBao в Kubernetes Secrets (ExternalSecret).
# Только контроллер — без webhook и cert-controller.
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: external-secrets
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.11.0
    helm:
      valuesObject:
        installCRDs: true
        webhook:
          create: false
        certController:
          create: false
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 192Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      # CRD ESO слишком большие для client-side apply
      - ServerSideApply=true
